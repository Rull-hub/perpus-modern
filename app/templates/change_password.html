{% extends "base.html" %}
{% block title %}Ubah Password — Perpus Modern{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="auth-card">
        <h1>Ubah Password</h1>
        <p class="auth-subtitle">Amankan akun Anda dengan password baru.</p>

        <form method="POST">
            <label for="old_password">Password Lama</label>
            <input type="password" id="old_password" name="old_password" required autofocus>

            <label for="new_password">Password Baru</label>
            <input type="password" id="new_password" name="new_password" required>

            <label for="confirm_password">Konfirmasi Password Baru</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <button type="submit" class="btn-submit">Simpan Password Baru</button>
        </form>

        <p class="auth-hint"><a href="{{ url_for('main.profile') }}" style="color: var(--text-muted);">Kembali ke Profil</a></p>
    </div>
</section>
{% endblock %}
